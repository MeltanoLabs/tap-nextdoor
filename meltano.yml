version: 1
send_anonymous_usage_stats: true
project_id: "tap-nextdoor"
default_environment: test
venv:
  backend: uv
environments:
- name: test
plugins:
  extractors:
  - name: "tap-nextdoor"
    namespace: "tap_nextdoor"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps

    settings:
    - name: access_token
      label: Access Token
      description: >
        Ads API access token, generated in Nextdoor Ads Manager at
        https://ads.nextdoor.com/v2/manage/api. Sent as a bearer token
        on every request.
      sensitive: true

    - name: advertiser_ids
      kind: array
      label: Advertiser IDs
      description: >
        Filter advertisers (and their child campaigns/ad groups/ads) to extract
        data for by ID. Leave empty to extract all advertisers the access token
        has access to, as reported by the /me endpoint.

    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: >
        Start of the reporting window for the performance_report and
        ad_stats streams. Accepts an ISO-8601 date-time
        (2026-01-01T00:00:00Z) or a plain date (2026-01-01); the API takes
        whole days, so any time component is truncated. Defaults to today.

    - name: end_date
      kind: date_iso8601
      label: End Date
      description: >
        End of the reporting window, inclusive. Accepts an ISO-8601 date-time
        (2026-01-31T23:59:59Z) or a plain date (2026-01-31). Defaults to today.

    - name: report
      kind: object
      label: Ad Performance Report
      description: >
        Definition of the custom report built by the performance_report
        stream via POST /reporting/create. Keys: metrics, dimension_granularity,
        time_granularity, name, stream_name, recipient_emails, campaign_ids,
        adgroup_ids, ad_ids. Set stream_name to match the chosen granularity,
        e.g. campaign_performance_report. NOTE: each sync creates a report in
        the advertiser's account and emails it to recipient_emails.

    - name: lookback_days
      kind: integer
      label: Lookback Days
      description: >
        How far before the bookmark the ad_stats stream restarts on an
        incremental run. Ad metrics are restated as conversions are attributed
        after the fact, so recent days are re-fetched. Defaults to 7.

    - name: page_size
      kind: integer
      label: Page Size
      description: >
        Number of records to request per page from the list endpoints
        (pagination_parameters.page_size).

    settings_group_validation:
    - [access_token]

    config:
      start_date: '2025-01-01'
      page_size: 500
      # The `report` definition is intentionally NOT set here - it is
      # environment-specific. Supply it as TAP_NEXTDOOR_REPORT (see .env.example).

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
